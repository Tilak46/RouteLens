name: Build and Release RouteLens (Windows, Mac, Linux)

on:
  push:
    branches:
      - tilak
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      # 🐧 Linux AppImage Packaging
      - name: Package Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage --publish never

      # 🍎 macOS Packaging (Both Apple Silicon M1-M4 arm64 + Intel x64)
      - name: Package Mac DMG & Zip
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 🪟 Windows Setup Packaging
      - name: Package Windows Installer
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --x64 --publish never

      # Artifact Uploads
      - name: Upload Linux Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: RouteLens-Linux-AppImage
          path: release/*/*.AppImage
          if-no-files-found: error

      - name: Upload Mac Artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: RouteLens-Mac-Installers
          path: |
            release/*/*.dmg
            release/*/*.zip
          if-no-files-found: error

      - name: Upload Windows Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: RouteLens-Windows-Setup
          path: release/*/*.exe
          if-no-files-found: error

  # 🚀 Automated GitHub Release Publisher
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/tilak' || github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Release Assets
        run: |
          mkdir -p release-dist
          find artifacts -type f \( -name "*.dmg" -o -name "*.zip" -o -name "*.exe" -o -name "*.AppImage" \) -exec cp {} release-dist/ \;
          echo "--- Assets ready for GitHub Release ---"
          ls -lh release-dist

      - name: Extract Project Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v$VERSION"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "Building release for: $TAG_NAME"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "RouteLens ${{ steps.version.outputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
