name: Build RouteLens Installers (Windows, Mac, Linux)

on:
  push:
    branches:
      - tilak
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Application
        run: npm run build

      # 🐧 Linux AppImage Packaging
      - name: Package Linux AppImage
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 🍎 macOS Packaging (Both Apple Silicon M1-M4 arm64 + Intel x64)
      - name: Package Mac DMG & Zip
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --x64 --arm64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 🪟 Windows Setup Packaging
      - name: Package Windows Installer
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --x64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Artifact Uploads
      - name: Upload Linux Artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: RouteLens-Linux-AppImage
          path: release/*/*.AppImage
          if-no-files-found: error

      - name: Upload Mac Artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: RouteLens-Mac-Installers
          path: |
            release/*/*.dmg
            release/*/*.zip
          if-no-files-found: error

      - name: Upload Windows Artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: RouteLens-Windows-Setup
          path: release/*/*.exe
          if-no-files-found: error
